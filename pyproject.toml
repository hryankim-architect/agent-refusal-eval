[project]
name = "agent-refusal-eval"
version = "0.3.0"
description = "Clean-room methodology harness that measures whether an agent's pre-tool-call screening gate correctly refuses/escalates abstract dual-use intent without over-refusing benign work, with bootstrap CIs and a threshold sweep. Ships a mock gate AND a real-model gate adapter (the model scores an abstract intent's refuse-risk, feeding the same decide/sweep/scorer). Defensive; abstract category labels only; no operational hazard content."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "H. Ryan Kim" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrefusal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # run tests from a fresh clone (no editable install needed)
